name: build
on:
  workflow_dispatch:
  push:
    branches: ['**']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - name: Unpack mod project
        run: unzip -q modsource.zip -d proj
      - name: Fix API names for 1.21.4
        working-directory: proj
        run: |
          sed -i 's/net\.minecraft\.client\.option\.ParticlesMode/net.minecraft.particle.ParticlesMode/' src/main/java/dev/mobilevisual/Optimizer.java
          sed -i 's/mc\.send(/mc.execute(/' src/main/java/dev/mobilevisual/MobileVisualClient.java
      - name: Build
        working-directory: proj
        run: gradle build
      - name: Pick the mod jar
        run: |
          mkdir -p dist
          cp $(ls proj/build/libs/*.jar | grep -v -- '-sources') dist/
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: mobilevisual
          path: dist/*.jar
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest dist/*.jar --target "${{ github.sha }}" --title "Mobile Visual (latest build)" --notes "Build from commit ${{ github.sha }}"
