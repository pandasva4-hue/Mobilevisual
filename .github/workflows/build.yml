name: build
on:
  workflow_dispatch:
  push:
    branches: ['**']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - name: Create mod project files
        run: |
          mkdir -p src/main/java/dev/mobilevisual src/main/java/dev/mobilevisual/mixin src/main/resources src/main/resources/assets/mobilevisual/lang
          cat > build.gradle << 'EOF_MV_0'
          plugins {
              id 'fabric-loom' version '1.10-SNAPSHOT'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": inputs.properties.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          EOF_MV_0
          cat > settings.gradle << 'EOF_MV_1'
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          rootProject.name = 'mobilevisual'
          EOF_MV_1
          cat > gradle.properties << 'EOF_MV_2'
          org.gradle.jvmargs=-Xmx1G
          org.gradle.parallel=true

          # Fabric (Minecraft 1.21.4)
          minecraft_version=1.21.4
          yarn_mappings=1.21.4+build.8
          loader_version=0.16.10
          fabric_version=0.119.4+1.21.4

          # Mod
          mod_version=1.0.0
          maven_group=dev.mobilevisual
          archives_base_name=mobilevisual
          EOF_MV_2
          cat > src/main/resources/fabric.mod.json << 'EOF_MV_3'
          {
            "schemaVersion": 1,
            "id": "mobilevisual",
            "version": "${version}",
            "name": "Mobile Visual",
            "description": "Лёгкий клиентский визуал-мод: HUD, фулбрайт, зум, пресет оптимизации для телефонов (ZalithLauncher).",
            "authors": [],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": ["dev.mobilevisual.MobileVisualClient"]
            },
            "mixins": ["mobilevisual.mixins.json"],
            "depends": {
              "fabricloader": ">=0.16.0",
              "minecraft": "~1.21.4",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF_MV_3
          cat > src/main/resources/mobilevisual.mixins.json << 'EOF_MV_4'
          {
            "required": true,
            "minVersion": "0.8",
            "package": "dev.mobilevisual.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": [
              "SimpleOptionAccessor"
            ],
            "injectors": {
              "defaultRequire": 1
            }
          }
          EOF_MV_4
          cat > src/main/resources/assets/mobilevisual/lang/en_us.json << 'EOF_MV_5'
          {
            "key.mobilevisual.menu": "Open menu",
            "key.mobilevisual.zoom": "Zoom",
            "category.mobilevisual": "Mobile Visual"
          }
          EOF_MV_5
          cat > src/main/resources/assets/mobilevisual/lang/ru_ru.json << 'EOF_MV_6'
          {
            "key.mobilevisual.menu": "Открыть меню",
            "key.mobilevisual.zoom": "Зум",
            "category.mobilevisual": "Mobile Visual"
          }
          EOF_MV_6
          cat > src/main/java/dev/mobilevisual/MobileVisualClient.java << 'EOF_MV_7'
          package dev.mobilevisual;

          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.command.v2.ClientCommandManager;
          import net.fabricmc.fabric.api.client.command.v2.ClientCommandRegistrationCallback;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientLifecycleEvents;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.fabricmc.fabric.api.client.rendering.v1.HudRenderCallback;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.text.Text;
          import org.lwjgl.glfw.GLFW;

          public class MobileVisualClient implements ClientModInitializer {
              private static KeyBinding menuKey;
              private static KeyBinding zoomKey;

              @Override
              public void onInitializeClient() {
                  Config.load();

                  menuKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                          "key.mobilevisual.menu", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_RIGHT_SHIFT, "category.mobilevisual"));
                  zoomKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                          "key.mobilevisual.zoom", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_C, "category.mobilevisual"));

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      while (menuKey.wasPressed()) {
                          client.setScreen(new VisualScreen(null));
                      }
                      Effects.tick(client, zoomKey.isPressed());
                  });

                  HudRenderCallback.EVENT.register(HudOverlay::render);

                  ClientLifecycleEvents.CLIENT_STOPPING.register(Effects::restore);

                  // /visual — открыть меню, /visual mobile — применить пресет оптимизации.
                  // Команды удобны на телефоне: чат открывается экранной кнопкой.
                  ClientCommandRegistrationCallback.EVENT.register((dispatcher, registryAccess) ->
                          dispatcher.register(ClientCommandManager.literal("visual")
                                  .executes(ctx -> {
                                      MinecraftClient mc = ctx.getSource().getClient();
                                      mc.send(() -> mc.setScreen(new VisualScreen(null)));
                                      return 1;
                                  })
                                  .then(ClientCommandManager.literal("mobile").executes(ctx -> {
                                      Optimizer.applyMobilePreset(ctx.getSource().getClient());
                                      ctx.getSource().sendFeedback(Text.literal("Mobile preset applied"));
                                      return 1;
                                  }))));
              }
          }
          EOF_MV_7
          cat > src/main/java/dev/mobilevisual/Config.java << 'EOF_MV_8'
          package dev.mobilevisual;

          import net.fabricmc.loader.api.FabricLoader;

          import java.io.IOException;
          import java.io.Reader;
          import java.io.Writer;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.Properties;

          /** Простые настройки, сохраняются в config/mobilevisual.properties. */
          public final class Config {
              public static boolean hud = true;
              public static boolean armor = true;
              public static boolean ping = false;
              public static boolean fullbright = false;
              public static boolean clearWeather = false;

              private Config() {}

              private static Path file() {
                  return FabricLoader.getInstance().getConfigDir().resolve("mobilevisual.properties");
              }

              public static void load() {
                  Path f = file();
                  if (!Files.exists(f)) return;
                  try (Reader r = Files.newBufferedReader(f)) {
                      Properties p = new Properties();
                      p.load(r);
                      hud = Boolean.parseBoolean(p.getProperty("hud", "true"));
                      armor = Boolean.parseBoolean(p.getProperty("armor", "true"));
                      ping = Boolean.parseBoolean(p.getProperty("ping", "false"));
                      fullbright = Boolean.parseBoolean(p.getProperty("fullbright", "false"));
                      clearWeather = Boolean.parseBoolean(p.getProperty("clearWeather", "false"));
                  } catch (IOException ignored) {
                  }
              }

              public static void save() {
                  Properties p = new Properties();
                  p.setProperty("hud", Boolean.toString(hud));
                  p.setProperty("armor", Boolean.toString(armor));
                  p.setProperty("ping", Boolean.toString(ping));
                  p.setProperty("fullbright", Boolean.toString(fullbright));
                  p.setProperty("clearWeather", Boolean.toString(clearWeather));
                  try (Writer w = Files.newBufferedWriter(file())) {
                      p.store(w, "Mobile Visual");
                  } catch (IOException ignored) {
                  }
              }
          }
          EOF_MV_8
          cat > src/main/java/dev/mobilevisual/Effects.java << 'EOF_MV_9'
          package dev.mobilevisual;

          import dev.mobilevisual.mixin.SimpleOptionAccessor;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.option.SimpleOption;

          /** Логика, которая выполняется каждый тик: фулбрайт, зум, чистая погода. */
          public final class Effects {
              private static final double FULL_GAMMA = 15.0;
              private static final int ZOOM_FOV = 30;

              private static boolean fullbrightApplied = false;
              private static double savedGamma = 1.0;

              private static boolean zooming = false;
              private static int savedFov = 70;

              private Effects() {}

              public static void tick(MinecraftClient client, boolean zoomPressed) {
                  if (client.options == null) return;
                  tickFullbright(client);
                  tickZoom(client, zoomPressed);

                  if (Config.clearWeather && client.world != null) {
                      client.world.setRainGradient(0.0f);
                      client.world.setThunderGradient(0.0f);
                  }
              }

              private static void tickFullbright(MinecraftClient client) {
                  SimpleOption<Double> gamma = client.options.getGamma();
                  if (Config.fullbright) {
                      if (!fullbrightApplied) {
                          savedGamma = gamma.getValue();
                          fullbrightApplied = true;
                      }
                      if (gamma.getValue() != FULL_GAMMA) {
                          setUnchecked(gamma, FULL_GAMMA);
                      }
                  } else if (fullbrightApplied) {
                      setUnchecked(gamma, savedGamma);
                      fullbrightApplied = false;
                  }
              }

              private static void tickZoom(MinecraftClient client, boolean zoomPressed) {
                  SimpleOption<Integer> fov = client.options.getFov();
                  if (zoomPressed && client.currentScreen == null) {
                      if (!zooming) {
                          savedFov = fov.getValue();
                          zooming = true;
                      }
                      if (fov.getValue() != ZOOM_FOV) {
                          fov.setValue(ZOOM_FOV);
                      }
                  } else if (zooming) {
                      fov.setValue(savedFov);
                      zooming = false;
                  }
              }

              /** Вернуть гамму и FOV, чтобы в options.txt не осталось значений от мода. */
              public static void restore(MinecraftClient client) {
                  if (client.options == null) return;
                  if (fullbrightApplied) {
                      setUnchecked(client.options.getGamma(), savedGamma);
                      fullbrightApplied = false;
                  }
                  if (zooming) {
                      client.options.getFov().setValue(savedFov);
                      zooming = false;
                  }
              }

              private static void setUnchecked(SimpleOption<Double> option, double value) {
                  ((SimpleOptionAccessor) (Object) option).mobilevisual$setValue(value);
              }
          }
          EOF_MV_9
          cat > src/main/java/dev/mobilevisual/HudOverlay.java << 'EOF_MV_10'
          package dev.mobilevisual;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.font.TextRenderer;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.network.ClientPlayerEntity;
          import net.minecraft.client.network.PlayerListEntry;
          import net.minecraft.client.render.RenderTickCounter;
          import net.minecraft.entity.EquipmentSlot;
          import net.minecraft.item.ItemStack;

          import java.util.Locale;

          /** Лёгкий HUD: только текст и иконки предметов через стандартный DrawContext (без своих шейдеров/GL). */
          public final class HudOverlay {
              private static final EquipmentSlot[] ARMOR = {
                      EquipmentSlot.HEAD, EquipmentSlot.CHEST, EquipmentSlot.LEGS, EquipmentSlot.FEET
              };
              private static final int WHITE = 0xFFFFFFFF;

              private HudOverlay() {}

              public static void render(DrawContext ctx, RenderTickCounter tickCounter) {
                  if (!Config.hud && !Config.armor) return;

                  MinecraftClient client = MinecraftClient.getInstance();
                  ClientPlayerEntity player = client.player;
                  if (player == null || client.options.hudHidden) return;

                  TextRenderer font = client.textRenderer;

                  if (Config.hud) {
                      int y = 4;
                      ctx.drawTextWithShadow(font, "FPS: " + client.getCurrentFps(), 4, y, WHITE);
                      y += 10;
                      ctx.drawTextWithShadow(font, String.format(Locale.ROOT, "XYZ: %.1f / %.1f / %.1f",
                              player.getX(), player.getY(), player.getZ()), 4, y, WHITE);
                      y += 10;

                      if (Config.ping && client.getNetworkHandler() != null) {
                          PlayerListEntry entry = client.getNetworkHandler().getPlayerListEntry(player.getUuid());
                          if (entry != null) {
                              ctx.drawTextWithShadow(font, "Ping: " + entry.getLatency() + " ms", 4, y, WHITE);
                          }
                      }
                  }

                  if (Config.armor) {
                      int x = ctx.getScaledWindowWidth() - 22;
                      int y = 4;
                      for (EquipmentSlot slot : ARMOR) {
                          ItemStack stack = player.getEquippedStack(slot);
                          if (stack.isEmpty()) continue;
                          ctx.drawItem(stack, x, y);
                          ctx.drawStackOverlay(font, stack, x, y);
                          y += 18;
                      }
                  }
              }
          }
          EOF_MV_10
          cat > src/main/java/dev/mobilevisual/Optimizer.java << 'EOF_MV_11'
          package dev.mobilevisual;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.option.CloudRenderMode;
          import net.minecraft.client.option.GameOptions;
          import net.minecraft.client.option.GraphicsMode;
          import net.minecraft.client.option.ParticlesMode;

          /** Пресет настроек графики для слабых устройств / телефонов. */
          public final class Optimizer {
              private Optimizer() {}

              public static void applyMobilePreset(MinecraftClient client) {
                  GameOptions o = client.options;
                  o.getViewDistance().setValue(6);
                  o.getSimulationDistance().setValue(5);
                  o.getGraphicsMode().setValue(GraphicsMode.FAST);
                  o.getParticles().setValue(ParticlesMode.MINIMAL);
                  o.getCloudRenderMode().setValue(CloudRenderMode.OFF);
                  o.getEntityShadows().setValue(false);
                  o.getBiomeBlendRadius().setValue(0);
                  o.getEntityDistanceScaling().setValue(0.75);
                  o.getMaxFps().setValue(60);
                  o.write();
              }
          }
          EOF_MV_11
          cat > src/main/java/dev/mobilevisual/VisualScreen.java << 'EOF_MV_12'
          package dev.mobilevisual;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.text.Text;

          import java.util.function.BooleanSupplier;
          import java.util.function.Consumer;

          /** Меню с большими кнопками — удобно нажимать пальцем. */
          public class VisualScreen extends Screen {
              private static final int W = 150;
              private static final int H = 20;
              private static final int GAP = 4;

              private final Screen parent;

              public VisualScreen(Screen parent) {
                  super(Text.literal("Mobile Visual"));
                  this.parent = parent;
              }

              @Override
              protected void init() {
                  int left = this.width / 2 - W - GAP / 2;
                  int right = this.width / 2 + GAP / 2;
                  int y = Math.max(28, this.height / 2 - 50);
                  int step = H + GAP;

                  toggle(left, y, "HUD", () -> Config.hud, v -> Config.hud = v);
                  toggle(right, y, "Fullbright", () -> Config.fullbright, v -> Config.fullbright = v);
                  y += step;

                  toggle(left, y, "Armor", () -> Config.armor, v -> Config.armor = v);
                  toggle(right, y, "Clear weather", () -> Config.clearWeather, v -> Config.clearWeather = v);
                  y += step;

                  toggle(left, y, "Ping", () -> Config.ping, v -> Config.ping = v);
                  this.addDrawableChild(ButtonWidget.builder(Text.literal("Mobile preset"),
                                  b -> Optimizer.applyMobilePreset(MinecraftClient.getInstance()))
                          .dimensions(right, y, W, H).build());
                  y += step + 8;

                  this.addDrawableChild(ButtonWidget.builder(Text.literal("Done"), b -> this.close())
                          .dimensions(this.width / 2 - W / 2, y, W, H).build());
              }

              private void togg
